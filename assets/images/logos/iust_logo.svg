<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="iustBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="iustAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="iustShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="url(#iustBlueGrad)" stroke-width="4" stroke-dasharray="8,4" />
  <circle cx="150" cy="150" r="132" fill="#0b1120" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Outer Typography Arch -->
  <path id="archTop" d="M 45,150 A 105,105 0 0,1 255,150" fill="none" stroke="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" letter-spacing="2.8">
    <textPath href="#archTop" startOffset="50%" text-anchor="middle">IRAN UNIVERSITY OF SCIENCE &amp; TECHNOLOGY</textPath>
  </text>
  
  <path id="archBottom" d="M 255,150 A 105,105 0 0,1 45,150" fill="none" stroke="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">
    <textPath href="#archBottom" startOffset="50%" text-anchor="middle">SCHOOL OF COMPUTER ENGINEERING • 4051</textPath>
  </text>

  <!-- Central Crest: Geometric Science & Knowledge Emblem -->
  <g transform="translate(150, 150) scale(1.15)">
    <!-- Architectural Dome & Gear Rays -->
    <path d="M-40,25 L-40,5 C-40,-30 -20,-55 0,-62 C20,-55 40,-30 40,5 L40,25 Z" fill="none" stroke="url(#iustAccentGrad)" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Central Knowledge Torch Flame -->
    <path d="M0,-52 C-10,-40 -12,-25 0,-10 C12,-25 10,-40 0,-52 Z" fill="url(#iustAccentGrad)" />
    <circle cx="0" cy="-28" r="4.5" fill="#f8fafc" />

    <!-- Open Book / Pages of Science -->
    <path d="M-30,12 C-15,6 0,8 0,8 C0,8 15,6 30,12 L26,30 C13,24 0,26 0,26 C0,26 -13,24 -26,30 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="0" y1="8" x2="0" y2="26" stroke="#38bdf8" stroke-width="2" />

    <!-- Stylized Lower Base Plinth -->
    <rect x="-35" y="34" width="70" height="6" rx="3" fill="url(#iustBlueGrad)" />
  </g>
</svg>